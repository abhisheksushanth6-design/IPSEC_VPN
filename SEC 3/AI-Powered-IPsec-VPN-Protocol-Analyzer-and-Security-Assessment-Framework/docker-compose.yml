# Optional development environment. Docker is NOT required: the backend and
# frontend also run directly with uvicorn and npm (see README).

services:
  backend:
    image: python:3.12-slim
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      APPLICATION_MODE: DEMO
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: INFO
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_WS_BASE_URL: ws://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
