<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IPsec VPN Protocol Analyzer</title>
    <meta
      name="description"
      content="AI-Powered IPsec VPN Protocol Analyzer and Security Assessment Framework"
    />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ipsec_vpn_theme') || localStorage.getItem('theme');
          var theme = (saved === 'dark' || saved === 'light') ? saved : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
