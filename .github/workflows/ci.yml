name: CI

# The active project lives under "SEC 14/…"; GitHub only runs workflows from the repository root,
# so this file drives both suites from here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_DIR: SEC 14/AI-Powered-IPsec-VPN-Protocol-Analyzer-and-Security-Assessment-Framework

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SEC 14/AI-Powered-IPsec-VPN-Protocol-Analyzer-and-Security-Assessment-Framework/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: SEC 14/AI-Powered-IPsec-VPN-Protocol-Analyzer-and-Security-Assessment-Framework/backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall -q app

      - name: Import check
        run: python -c "from app.main import app; print(app.title)"

      - name: Run tests (tests/backend via pytest.ini)
        run: python -m pytest -q

  frontend:
    name: Frontend (typecheck, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SEC 14/AI-Powered-IPsec-VPN-Protocol-Analyzer-and-Security-Assessment-Framework/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: SEC 14/AI-Powered-IPsec-VPN-Protocol-Analyzer-and-Security-Assessment-Framework/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Production build
        run: npm run build
